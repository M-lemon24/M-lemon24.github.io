name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 安装 C++ 编译依赖（解决 node-gyp 编译 re2 失败问题）
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # 2. 安装 pnpm 包管理器
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 3. 配置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 4. 安装项目依赖
      - name: Install dependencies
        run: pnpm install

      # 5. 构建 Astro 静态文件
      - name: Build Astro
        run: pnpm run build

      # 6. 上传静态产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
