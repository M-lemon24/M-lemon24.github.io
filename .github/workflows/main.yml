name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true



jobs:

  build:

    name: Build

    runs-on: ubuntu-latest


    steps:

      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4



      # 安装编译环境
      # 用于解决 node-gyp / re2 编译失败
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            make \
            g++

          python3 --version
          g++ --version



      # 根据 package.json 中
      # "packageManager": "pnpm@10.28.2"
      # 自动安装对应版本
      - name: Install pnpm
        uses: pnpm/action-setup@v4



      # Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm



      # GitHub Pages配置
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5



      # 安装依赖
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
        env:
          npm_config_python: /usr/bin/python3
          npm_config_build_from_source: false



      # 构建 Astro
      - name: Build Astro
        run: |
          pnpm run build



      # 上传dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/




  deploy:


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    needs: build


    runs-on: ubuntu-latest


    name: Deploy


    steps:


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
